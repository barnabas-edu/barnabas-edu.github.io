<main>
	<h1>Osztályok</h1>
	Ezen az oldalon lesznek megjelenítve az általam tanított osztályok.
	<script>
		// Header-ből történő betöltés
document.addEventListener('DOMContentLoaded', function() {
    function frissitOsztalyListat() {
        // Megkeressük a header-t
        const header = document.querySelector('header');
        
        if (!header) {
            console.log('Nem található header elem.');
            return;
        }
        
        // A headerben keressük a nav__item elemeket
        const headerNavItems = header.querySelectorAll('.nav__item');
        
        // Kiszűrjük az osztaly id-vel rendelkezőket
        const osztalyItems = Array.from(headerNavItems).filter(item => item.id === 'osztaly');
        
        // Megkeressük az oldal nav__list-jét
        const pageNavList = document.querySelector('.nav__list');
        
        if (pageNavList && osztalyItems.length > 0) {
            pageNavList.innerHTML = '';
            osztalyItems.forEach(item => {
                pageNavList.appendChild(item.cloneNode(true));
            });
            
            console.log(`Sikeresen betöltve ${osztalyItems.length} osztály elem a headerből.`);
        } else if (osztalyItems.length === 0) {
            console.log('Nincsenek osztaly id-vel rendelkező nav__item elemek a headerben.');
        }
    }
    
    // Kezdeti betöltés
    frissitOsztalyListat();
    
    // Dinamikus frissítés figyelővel
    const observer = new MutationObserver(frissitOsztalyListat);
    
    const header = document.querySelector('header');
    if (header) {
        observer.observe(header, {
            childList: true,
            subtree: true,
            attributes: true
        });
    }
});
	</script>
</main>
