<body>
	<div class="wrapper">
<script src="/suli/js/headerFooterManager.js"></script>
	<my-header></my-header>
<main>
	<h1>Blog</h1>
	
	<script>
    const blogUrl = 'https://hbsuli.blogspot.com';
    const postsPerPage = 9;
    let currentPage = 1;
    let totalPosts = 0;
    let totalPages = 0;

    // Oldal kiolvasása az URL-ből
    function getPageFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      const page = parseInt(urlParams.get('page')) || 1;
      return Math.max(1, page);
    }

    // URL frissítése az oldalszámmal
    function updateUrl(page) {
      const url = new URL(window.location);
      if (page > 1) {
        url.searchParams.set('page', page);
      } else {
        url.searchParams.delete('page');
      }
      window.history.pushState({ page: page }, '', url);
    }

    // Segédfüggvény az első kép kinyeréséhez
    function extractFirstImage(content) {
      if (!content) return null;
      
      const imgMatch = content.match(/<img[^>]+src="([^"]+)"/i);
      if (imgMatch && imgMatch[1]) {
        let imageUrl = imgMatch[1];
        imageUrl = imageUrl.replace(/\/s\d+-c\//, '/s320/');
        imageUrl = imageUrl.replace(/\/s\d+\//, '/s320/');
        
        if (imageUrl.startsWith('//')) {
          imageUrl = 'https:' + imageUrl;
        }
        
        return imageUrl;
      }
      return null;
    }

    // Segédfüggvény a rövid ID kinyeréséhez
    function extractShortId(fullId) {
      const match = fullId.match(/post-(\d+)/);
      return match ? match[1] : fullId;
    }

    // Segédfüggvény a slug generálásához
    function createSlug(title) {
      return title
        .toLowerCase()
        .replace(/[^a-z0-9áéíóöőúüű\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-+|-+$/g, '')
        .substring(0, 50);
    }

    // Oldal betöltése
    function loadPage(page) {
      const startIndex = (page - 1) * postsPerPage + 1;
      const feedUrl = `${blogUrl}/feeds/posts/default?max-results=${postsPerPage}&start-index=${startIndex}&alt=json-in-script&callback=handlePosts`;
      
      // Betöltés jelzése
      document.getElementById('postList').innerHTML = '<div class="loading-indicator">Bejegyzések betöltése...</div>';
      document.getElementById('pagination').style.display = 'none';
      
      // Régi script eltávolítása (ha van)
      const oldScript = document.querySelector('script[data-feed]');
      if (oldScript) {
        oldScript.remove();
      }
      
      // Új script létrehozása
      const script = document.createElement('script');
      script.src = feedUrl;
      script.setAttribute('data-feed', 'true');
      document.head.appendChild(script);
    }

    function handlePosts(data) {
      const posts = data.feed.entry || [];
      const postList = document.getElementById('postList');
      
      // Összes bejegyzés számának meghatározása
      if (data.feed.openSearch$totalResults) {
        totalPosts = parseInt(data.feed.openSearch$totalResults.$t);
        totalPages = Math.ceil(totalPosts / postsPerPage);
      }
      
      if (posts.length === 0) {
        postList.innerHTML = '<div class="loading-indicator">Nincsenek bejegyzések ezen az oldalon.</div>';
        return;
      }
      
      postList.innerHTML = '';
      
      posts.forEach((post) => {
        const title = post.title.$t;
        const date = new Date(post.published.$t).toLocaleDateString('hu-HU');
        const shortId = extractShortId(post.id.$t);
        const slug = createSlug(title);
        
        // Jobb minőségű kép kinyerése
        let imageUrl = null;
        if (post.content && post.content.$t) {
          imageUrl = extractFirstImage(post.content.$t);
        }
        
        if (!imageUrl && post.media$thumbnail && post.media$thumbnail.url) {
          imageUrl = post.media$thumbnail.url.replace(/\/s72-c\//, '/s320/');
        }
        
        let snippet = '';
        if (post.summary && post.summary.$t) {
          snippet = post.summary.$t.replace(/<[^>]+>/g, '').trim();
        } else if (post.content && post.content.$t) {
          snippet = post.content.$t.replace(/<[^>]+>/g, '').trim().substring(0, 200);
        }
        if (snippet.length > 180) {
          snippet = snippet.substring(0, 180) + '…';
        }
        
        // Kép HTML generálása
        let thumbnailHtml = '';
        if (imageUrl) {
          thumbnailHtml = `
            <div class="post-thumb">
              <img src="${imageUrl}" alt="${title}" loading="lazy">
            </div>
          `;
        } else {
          thumbnailHtml = `
            <div class="post-thumb">
              <div class="no-image">Nincs kép</div>
            </div>
          `;
        }
        
        postList.innerHTML += `
          <div class="card">
            ${thumbnailHtml}
            <div class="post-text">
              <h2><a href="post.html?id=${shortId}&slug=${slug}">${title}</a></h2>
              <span class="post-date">📅 ${date}</span>
              <p class="post-snippet">${snippet}</p>
            </div>
          </div>
        `;
      });
      
      // Lapozó frissítése
      updatePagination();
    }

    function updatePagination() {
      const pagination = document.getElementById('pagination');
      pagination.style.display = 'flex';
      
      let html = '';
      
      // Előző gomb
      if (currentPage > 1) {
        html += `<button href="?page=${currentPage - 1}" onclick="goToPage(event, ${currentPage - 1})">🠄 Előző oldal</button>`;
      } else {
        html += `<button disabled>🠄 Előző oldal</button>`;
      }
      
      // Oldalszámok generálása
      const maxVisiblePages = 5;
      let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
      let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
      
      if (endPage - startPage + 1 < maxVisiblePages) {
        startPage = Math.max(1, endPage - maxVisiblePages + 1);
      }
      
      // Első oldal és ellipszis
      if (startPage > 1) {
        html += `<a href="?page=1" onclick="goToPage(event, 1)">1</a>`;
        if (startPage > 2) {
          html += `<span class="ellipsis">…</span>`;
        }
      }
      
      // Oldalszámok
      for (let i = startPage; i <= endPage; i++) {
        if (i === currentPage) {
          html += `<span class="current">${i}. oldal</span>`;
        }
      }
      
      // Utolsó oldal és ellipszis
      if (endPage < totalPages) {
        if (endPage < totalPages - 1) {
          html += `<span class="ellipsis">…</span>`;
        }
        html += `<a href="?page=${totalPages}" onclick="goToPage(event, ${totalPages})">${totalPages}</a>`;
      }
      
      // Következő gomb
      if (currentPage < totalPages) {
        html += `<button href="?page=${currentPage + 1}" onclick="goToPage(event, ${currentPage + 1})">Következő oldal 🠆</button>`;
      } else {
        html += `<button disabled>Következő oldal 🠆</button>`;
      }
      
      pagination.innerHTML = html;
    }
	
	function goToPage(event, page) {
      event.preventDefault();
      
      if (page < 1 || page > totalPages) return;
      
      currentPage = page;
      updateUrl(page);
      loadPage(page);
    }

    // Böngésző vissza/előre navigáció kezelése
    window.addEventListener('popstate', function(event) {
      const newPage = getPageFromUrl();
      if (newPage !== currentPage) {
        currentPage = newPage;
        loadPage(newPage);
      }
    });

    // Kezdőoldal betöltése
    loadPage(1);
  </script>
</main>
	</div>
	<script src="/js/theme-switcher.js"></script>
</body>
</html>
